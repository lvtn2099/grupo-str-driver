name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK with accepted licenses
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preserve debug signing certificate between test builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: str-driver-debug-signing-v1
      - name: Build and capture full diagnostic log
        shell: bash
        run: |
          set -o pipefail
          gradle :android:app:assembleDebug --stacktrace --info --no-daemon 2>&1 | tee android-build.log
      - name: Publish compilation error to repository issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f android-build.log ]; then
            tail -n 160 android-build.log > error-tail.txt
          else
            echo "Build failed before Gradle produced its diagnostic log." > error-tail.txt
          fi
          {
            echo 'Automated Android build failure diagnostic.'
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '~~~'
            cat error-tail.txt
            echo '~~~'
          } > issue-body.md
          gh issue create --title "Android build failure ${GITHUB_SHA:0:7}" --body-file issue-body.md
      - name: Upload build log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grupo-str-build-diagnostics
          path: android-build.log
          if-no-files-found: warn
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GrupoSTRDriver-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish persistent direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk GrupoSTR-GPS-Nativo-v0.3.2.apk
          gh release view gps-v0.3.2 >/dev/null 2>&1 && {
            gh release upload gps-v0.3.2 GrupoSTR-GPS-Nativo-v0.3.2.apk --clobber
          } || {
            gh release create gps-v0.3.2 GrupoSTR-GPS-Nativo-v0.3.2.apk \
              --target "$GITHUB_SHA" \
              --title "Grupo STR GPS Nativo v0.3.2 — Android test APK" \
              --notes "Android GPS companion for Grupo STR Base44. Debug-signed test build, not a production release. On existing installations, preserve pending GPS data before uninstalling." \
              --prerelease
          }
          echo "APK direct download: https://github.com/${GITHUB_REPOSITORY}/releases/download/gps-v0.3.2/GrupoSTR-GPS-Nativo-v0.3.2.apk" >> "$GITHUB_STEP_SUMMARY"
